# Prometheus scrapes the Collector's Prometheus exporter; nothing scrapes the
# agent itself, which only lives for a few seconds per run.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    # Keep the job/instance labels the Collector derives from each metric's
    # resource (service.name -> job) instead of overwriting them with this
    # scrape job's own.
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
