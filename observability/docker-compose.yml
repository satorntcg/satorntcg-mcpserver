# Local metrics stack for agent/run-agent.js: OpenTelemetry Collector + Prometheus
# + Grafana (Prometheus is provisioned as Grafana's data source; no dashboards yet).
#
# Traces are NOT part of this. They keep going straight from the agent and the
# MCP server to the standalone Jaeger container (`docker run ... jaeger`, see the
# README), which already owns host ports 4317/4318/16686. The Collector's OTLP
# HTTP receiver is therefore published on 4319 instead, and only has a metrics
# pipeline.
#
# All ports bind to 127.0.0.1 so nothing is reachable from the network.
#
#   docker compose -f observability/docker-compose.yml up -d
#   docker compose -f observability/docker-compose.yml down

name: satorntcg-observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4319:4318" # OTLP/HTTP in (agent -> Collector), metrics only
      - "127.0.0.1:8889:8889" # Prometheus exposition of what the Collector holds
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - otel-collector
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Only applied the first time grafana-data is initialised. Default admin/admin
      # (Grafana asks for a new password on first login); override via env/.env.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      # Only the datasources subfolder, so the image's own (empty) dashboards/
      # and alerting/ provisioning folders stay as they are.
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
